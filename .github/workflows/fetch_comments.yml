name: Fetch Comments

# Daily schedule disabled 2026-09-09: the FAA-2026-4558 comment period closed
# August 5, 2026 and no new comments have posted since. The tracker is now a
# static final snapshot; re-run manually via workflow_dispatch if the docket
# reopens or a late comment appears.
on:
  workflow_dispatch:         # manual trigger from Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch comments
        env:
          REGULATIONS_GOV_API_KEY: ${{ secrets.REGULATIONS_GOV_API_KEY }}
        run: python scripts/fetch_comments.py

      - name: Build analysis
        run: python scripts/analyze_comments.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/comments.json docs/data.js docs/analysis.js
          git diff --cached --quiet || git commit -m "chore: update comments + analysis $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
